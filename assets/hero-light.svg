<svg xmlns="http://www.w3.org/2000/svg" width="840" height="156" viewBox="0 0 840 156" fill="none" role="img" aria-label="Farbod Jolani GitHub Profile Banner">
  <defs>
    <linearGradient id="accent-line-light" x1="0" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0969da" />
      <stop offset="55%" stop-color="#8250df" />
      <stop offset="100%" stop-color="#1a7f37" />
    </linearGradient>
    <pattern id="bg-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#eaeef2" stroke-width="0.8"/>
    </pattern>
    <clipPath id="card-clip-light">
      <rect x="0.5" y="0.5" width="839" height="155" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect width="840" height="156" fill="#ffffff" />
    <rect width="840" height="156" fill="url(#bg-grid-light)" opacity="0.65" />
    <rect x="0" y="0" width="840" height="3" fill="url(#accent-line-light)" />
  </g>
  <rect x="0.5" y="0.5" width="839" height="155" rx="12" stroke="#d0d7de" stroke-width="1" />

  <!-- Top terminal breadcrumb -->
  <text x="32" y="34" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace' font-size="12" fill="#656d76">~/heat-core/overview</text>

  <!-- Right active status pill -->
  <g transform="translate(658, 18)">
    <rect width="150" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="15" cy="12" r="4" fill="#1a7f37"/>
    <text x="27" y="16" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace' font-size="11" font-weight="600" fill="#1f2328">REMOTE · ACTIVE</text>
  </g>

  <!-- Main Heading -->
  <text x="32" y="70" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="28" font-weight="700" fill="#1f2328">Farbod Jolani</text>
  <rect x="244" y="49" width="94" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="291" y="65" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace' font-size="12" font-weight="600" fill="#0969da">@heat-core</text>

  <!-- Positioning Subtitle -->
  <text x="32" y="96" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="500" fill="#656d76">AI / LLM &amp; Software Engineer — Reliable Agents, Local-First AI &amp; Cross-Platform Systems</text>

  <!-- Stack Pills -->
  <g transform="translate(32, 112)"><rect width="148" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="74.0" y="16" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace' font-size="11" font-weight="500" fill="#656d76">LLM · RAG · Agents</text></g><g transform="translate(190, 112)"><rect width="155" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="77.5" y="16" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace' font-size="11" font-weight="500" fill="#656d76">Python &amp; TypeScript</text></g><g transform="translate(355, 112)"><rect width="148" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="74.0" y="16" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace' font-size="11" font-weight="500" fill="#656d76">Electron &amp; FastAPI</text></g><g transform="translate(513, 112)"><rect width="120" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="60.0" y="16" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace' font-size="11" font-weight="500" fill="#656d76">Local-First AI</text></g>
</svg>
